<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-label="Conceptual ISP network flow from edge router to core routing, access network, subscribers and monitoring">
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0B1327"/><stop offset="1" stop-color="#092336"/></linearGradient>
  <linearGradient id="path" x1="0" x2="1"><stop stop-color="#2B7695"/><stop offset="0.5" stop-color="#54D9E8"/><stop offset="1" stop-color="#346D9E"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .label{font:700 17px 'Segoe UI',Arial,sans-serif;fill:#E2F5FC;letter-spacing:.5px}
    .sub{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#7CAABD}
    .title{font:700 15px ui-monospace,Consolas,monospace;fill:#6ADCE9;letter-spacing:3px}
    .wire{fill:none;stroke:#35B9D2;stroke-width:3;opacity:.75}
    .pulse{fill:#86F7FF;filter:url(#glow)}
    .blink{animation:blink 2.3s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:.6}50%{opacity:1}}
  </style>
</defs>
<rect width="1200" height="310" rx="20" fill="url(#bg)"/>
<rect x="9" y="9" width="1182" height="292" rx="14" fill="none" stroke="#255471"/>
<g opacity=".13" stroke="#3498B0">
  <path d="M0 55H1200 M0 105H1200 M0 155H1200 M0 205H1200 M0 255H1200"/>
  <path d="M75 0V310 M175 0V310 M275 0V310 M375 0V310 M475 0V310 M575 0V310 M675 0V310 M775 0V310 M875 0V310 M975 0V310 M1075 0V310"/>
</g>
<text x="38" y="41" class="title">NETWORK ENGINEERING / HOW SYSTEMS CONNECT</text>
<text x="1161" y="41" class="sub" text-anchor="end">ILLUSTRATIVE • NOT LIVE INFRASTRUCTURE</text>
<path id="r1" class="wire" d="M200 151H304"/>
<path id="r2" class="wire" d="M460 151H566"/>
<path id="r3" class="wire" d="M722 151H827"/>
<path id="r4" class="wire" d="M979 151H1041"/>
<path id="r5" class="wire" d="M650 198V242"/>
<g>
 <rect x="45" y="103" rx="15" width="155" height="96" fill="#12334B" stroke="#397F9B"/>
 <circle cx="122" cy="123" r="8" fill="#59D7E8" class="blink"/>
 <text x="122" y="160" class="label" text-anchor="middle">UPSTREAM</text><text x="122" y="181" class="sub" text-anchor="middle">Transit / IX</text>
 <rect x="304" y="103" rx="15" width="156" height="96" fill="#12334B" stroke="#397F9B"/>
 <circle cx="382" cy="123" r="8" fill="#59D7E8" class="blink"/>
 <text x="382" y="160" class="label" text-anchor="middle">CORE</text><text x="382" y="181" class="sub" text-anchor="middle">BGP / Routing</text>
 <rect x="566" y="103" rx="15" width="156" height="96" fill="#12334B" stroke="#397F9B"/>
 <circle cx="644" cy="123" r="8" fill="#59D7E8" class="blink"/>
 <text x="644" y="160" class="label" text-anchor="middle">EDGE</text><text x="644" y="181" class="sub" text-anchor="middle">PPPoE / Policy</text>
 <rect x="827" y="103" rx="15" width="152" height="96" fill="#12334B" stroke="#397F9B"/>
 <circle cx="903" cy="123" r="8" fill="#59D7E8" class="blink"/>
 <text x="906" y="160" class="label" text-anchor="middle">ACCESS</text><text x="906" y="181" class="sub" text-anchor="middle">OLT / GPON</text>
 <rect x="1041" y="103" rx="15" width="125" height="96" fill="#12334B" stroke="#397F9B"/>
 <circle cx="1104" cy="123" r="8" fill="#59D7E8" class="blink"/>
 <text x="1106" y="160" class="label" text-anchor="middle">USERS</text><text x="1106" y="181" class="sub" text-anchor="middle">Subscribers</text>
 <rect x="527" y="242" rx="12" width="244" height="40" fill="#14374B" stroke="#2D8A9D"/>
 <text x="650" y="267" class="label" text-anchor="middle" style="font-size:14px">OBSERVABILITY &amp; AUTOMATION</text>
</g>
<circle class="pulse" cx="253" cy="151" r="4"/>
<circle class="pulse" cx="513" cy="151" r="4"/>
<circle class="pulse" cx="769" cy="151" r="4"/>
<circle class="pulse" cx="1010" cy="151" r="4"/>
</svg>