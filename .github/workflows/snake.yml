name: Build GitHub contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '18 2 * * *'
  push:
    paths:
      - README.md
      - .github/workflows/snake.yml

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake images
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Netronixbd
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#008EA3
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#31D7E6
      - name: Publish generated SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
